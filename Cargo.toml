[package]
name = "intentumdiff-perl-parser"
version = "0.1.0"
edition = "2021"
description = "Perl parser plugin for IntentumDiff (full-parse mode)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# ts-convert is USED by this crate (lib.rs `use intentdiff_plugin_sdk::ts_convert`) and must be
# declared explicitly: inside the monorepo workspace, feature unification from sibling members
# enabled it silently; a standalone build (the #82 split repo) fails without it.
intentumdiff-plugin-sdk = { git = "https://github.com/buchochelliq-labs/intentumdiff-plugin-sdk", tag = "v0.1.0", features = ["ts-convert"] }
serde_json = "1"
tree-sitter = "0.25"
ts-parser-perl = "1.1.1"
wit-bindgen = { version = "0.57", default-features = false, features = ["std", "macros"] }

[dev-dependencies]
intentumdiff-plugin-sdk = { git = "https://github.com/buchochelliq-labs/intentumdiff-plugin-sdk", tag = "v0.1.0", features = ["testing"] }

# Plugins target WASI p2 (Component Model); mirrors the monorepo's certified build profile.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Build scripts run on the host; compile them simply so Windows AppControl doesn't block them
[profile.release.build-override]
opt-level = 0
codegen-units = 16
debug = false

# Patch out or stabilize build scripts (vendored from the monorepo's crates/patches).
[patch.crates-io]
quote = { path = "patches/quote" }
zmij = { path = "patches/zmij" }
serde_core = { path = "patches/serde_core" }
serde_json = { path = "patches/serde_json" }
wit-bindgen-rust-macro = { path = "patches/wit-bindgen-rust-macro" }
tree-sitter = { path = "patches/tree-sitter" }
ts-parser-perl = { path = "patches/ts-parser-perl" }
