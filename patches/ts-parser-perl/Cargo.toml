[package]
name = "ts-parser-perl"
version = "1.1.1"
edition = "2021"
license = "MIT"
# Patched: grammar C sources pre-compiled to lib/libts_parser_perl.a for wasm32-wasip2
# (zig cc, see docs/WASM_BUILD_PATCHES.md). Native builds compile the C sources.
build = "build.rs"
autolib = false

[lib]
name = "ts_parser_perl"
path = "bindings/rust/lib.rs"

[dependencies.tree-sitter-language]
version = "0.1"

[build-dependencies]
cc = "1"
